name: OCI A1 Instance Auto-Retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        availability_domain:
          - "KrkG:US-ASHBURN-AD-1"
          - "KrkG:US-ASHBURN-AD-2"
          - "KrkG:US-ASHBURN-AD-3"

    steps:
      - uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          git rev-parse HEAD
          git show -s --format='%H %s' HEAD
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "This is a re-run. GitHub Actions is still executing commit ${GITHUB_SHA}."
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Install dependencies
        run: composer install --no-dev

      - name: Create .env and key file
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        run: |
          set -euo pipefail
          cat <<EOF > .env
          OCI_USER_ID="${OCI_USER_ID}"
          OCI_TENANCY_ID="${OCI_TENANCY_ID}"
          OCI_KEY_FINGERPRINT="${OCI_KEY_FINGERPRINT}"
          OCI_REGION="${OCI_REGION}"
          OCI_AVAILABILITY_DOMAIN="${{ matrix.availability_domain }}"
          OCI_COMPARTMENT_ID="${OCI_COMPARTMENT_ID}"
          OCI_SUBNET_ID="${OCI_SUBNET_ID}"
          OCI_SHAPE="VM.Standard.A1.Flex"
          OCI_OCPUS="4"
          OCI_MEMORY_IN_GBS="24"
          OCI_IMAGE_OPERATING_SYSTEM="Oracle Linux"
          OCI_SSH_PUBLIC_KEY="${OCI_SSH_PUBLIC_KEY}"
          OCI_IMAGE_ID="${OCI_IMAGE_ID}"
          OCI_PRIVATE_KEY_FILENAME="/tmp/oci_api_key.pem"
          EOF
          printf '%s' "${OCI_PRIVATE_KEY}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Run OCI instance creation in ${{ matrix.availability_domain }}
        run: php index.php

name: OCI A1 Instance Auto-Retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Install dependencies
        run: composer install --no-dev

      - name: Create .env and key file
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf "OCI_USER_ID=%s\n" "$OCI_USER_ID" >> .env
          printf "OCI_TENANCY_ID=%s\n" "$OCI_TENANCY_ID" >> .env
          printf "OCI_KEY_FINGERPRINT=%s\n" "$OCI_KEY_FINGERPRINT" >> .env
          printf "OCI_REGION=%s\n" "$OCI_REGION" >> .env
          printf "OCI_AVAILABILITY_DOMAIN=%s\n" "$OCI_AVAILABILITY_DOMAIN" >> .env
          printf "OCI_COMPARTMENT_ID=%s\n" "$OCI_COMPARTMENT_ID" >> .env
          printf "OCI_SUBNET_ID=%s\n" "$OCI_SUBNET_ID" >> .env
          printf "OCI_SHAPE=VM.Standard.A1.Flex\n" >> .env
          printf "OCI_OCPUS=4\n" >> .env
          printf "OCI_MEMORY_IN_GBS=24\n" >> .env
          printf "OCI_SSH_PUBLIC_KEY=%s\n" "$OCI_SSH_PUBLIC_KEY" >> .env
          printf "OCI_PRIVATE_KEY_FILENAME=/tmp/oci_api_key.pem\n" >> .env
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

      - name: Run OCI instance creation
        run: php index.php

name: OCI A1 Instance Auto-Retry

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes, 24/7
  workflow_dispatch:         # also allow manual trigger

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Install dependencies
        run: composer install --no-dev

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_COMPARTMENT_ID=${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_OCPUS=4
          OCI_MEMORY_IN_GBS=24
          OCI_SSH_PUBLIC_KEY=${{ secrets.OCI_SSH_PUBLIC_KEY }}
          ENVEOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem
          echo "OCI_PRIVATE_KEY_FILENAME=/tmp/oci_api_key.pem" >> .env

      - name: Run OCI instance creation
        run: php index.php
